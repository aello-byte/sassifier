[project]
name = "sassifier"
version = "0.1.0"
description = ""
authors = [
    {name = "aello-byte"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "youtube-transcript-api (==1.2.2)",
    "certifi (==2025.8.3)",
    "charset-normalizer (==3.4.3)",
    "defusedxml (==0.7.1)",
    "idna (==3.10)",
    "pyarrow (==21.0.0)",
    "requests (==2.32.5)",
    "urllib3 (==2.5.0)",
    "yt-dlp (==2025.8.22)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "notebook (>=7.4.5,<8.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "nltk (>=3.9.1,<4.0.0)",
    "spacy (>=3.8.7,<4.0.0)"
]

[tool.poetry]
packages = [
    { include = "extractor", from = "src" },
    { include = "utils", from = "src" },
    { include = "transformer", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


